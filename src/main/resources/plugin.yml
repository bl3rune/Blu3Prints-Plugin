name: Blu3PrintPlugin
version: '1.7.6'
main: io.github.bl3rune.blu3printPlugin.Blu3PrintPlugin
api-version: '1.18'
prefix: Blu3Print
authors: [ bl3rune ]
description: A dynamic blueprint tool that allows players to capture/build/share/edit/preview designs
website: https://github.com/bl3rune/Blu3Prints-Plugin
commands:
  blu3print:
    description: Blu3printPlugin menu usage
    usage: /<command>
    permission: blu3print
    permission-message: You don't have permission to use the Blu3print menu
    aliases: [ bp ]
  blu3print.duplicate:
    description: Duplicate the Blu3Print currently held (If a blank Blu3Print is in inventory)
    usage: /<command>
    permission: blu3print.duplicate
    permission-message: You don't have permission duplicate this
    aliases: [ bp.duplicate ]
  blu3print.rotate:
    description: Rotate the Blu3Print currently held
    usage: /<command> <#optional# rotation> (default next rotation)
    permission: blu3print.rotate
    permission-message: You don't have permission to rotate this
    aliases: [ bp.rotate ]
  blu3print.turn:
    description: Turn the Blu3Print currently held
    usage: /<command> <turn>
    permission: blu3print.turn
    permission-message: You don't have permission to turn this
    aliases: [ bp.turn ]
  blu3print.face:
    description: Change the direction of the Blu3Print currently held
    usage: /<command> <#optional# direction> (default next face)
    permission: blu3print.face
    permission-message: You don't have permission to change the direction of this
    aliases: [ bp.face ]
  blu3print.import:
    description: Import a Blu3Print from a string to the current held Blu3Print
    usage: /<command> <name> <encodedString>
    permission: blu3print.import
    permission-message: You don't have permission to import
    aliases: [ bp.import ]
  blu3print.export:
    description: Export the Blu3Print currently held to a string
    usage: /<command>
    permission: blu3print.export
    permission-message: You don't have permission to export
    aliases: [ bp.export ]
  blu3print.scale:
    description: Change the scale of the Blu3Print currently held
    usage: /<command> <#optional# scale> (default current * 2)
    permission: blu3print.scale
    permission-message: You don't have permission to change the scale of this
    aliases: [ bp.scale ]
  blu3print.name:
    description: Set the name of the Blu3Print currently held
    usage: /<command> <name>
    permission: blu3print.name
    permission-message: You don't have permission to rename this
    aliases: [ bp.name ]
  blu3print.give:
    description: Gives player a blu3print
    usage: /<command> <#optional# player>
    permission: blu3print.give
    permission-message: You don't have permission to give players a blu3print writer
    aliases: [ bp.give ]
  blu3print.help:
    description: Get help for Blu3PrintPlugin
    usage: /<command>
    permission: blu3print.help
    permission-message: You don't have permission to get help for Blu3PrintPlugin
    aliases: [ bp.help ]
  blu3print.config:
    description: Set per-player-per-blu3print config for Blu3prints
    usage: /<command> <config-type> <value>
    permission: blu3print.config
    permission-message: You don't have permission to set config for each Blu3print
    aliases: [ bp.config ]
  blu3print.player-config:
    description: Set player config for Blu3prints
    usage: /<command> <config-type> <value>
    permission: blu3print.player-config
    permission-message: You don't have permission to set player config for Blu3print Plugin
    aliases: [ bp.player ]
  blu3print.global-config:
    description: Set global config for Blu3prints
    usage: /<command> <config-type> <value>
    permission: blu3print.global-config
    permission-message: You don't have permission to set global config for Blu3print Plugin
    aliases: [ bp.global ]
permissions:
  blu3print.*:
    default: false
    description: Allowed to use all Blu3PrintPlugin commands with no restrictions or costs
    children:
      blu3print: true
      blu3print.duplicate: true
      blu3print.rotate: true
      blu3print.turn: true
      blu3print.face: true
      blu3print.import: true
      blu3print.export: true
      blu3print.scale: true
      blu3print.name: true
      blu3print.help: true
      blu3print.holograms: true
      blu3print.config: true
      blu3print.no-size-limit: true
      blu3print.no-scale-limit: true
      blu3print.force-place-discount: true
      blu3print.no-block-cost: true
      blu3print.give: true
      blu3print.update-available-message: true
      blu3print.player-config: true
      blu3print.global-config: true
  blu3print.basics:
    description: Allowed to use Blu3Prints
    default: not op
    children:
      blu3print: true
      blu3print.duplicate: true
      blu3print.rotate: true
      blu3print.turn: true
      blu3print.face: true
      blu3print.import: true
      blu3print.export: true
      blu3print.scale: true
      blu3print.name: true
      blu3print.help: true
      blu3print.holograms: true
      blu3print.config: true
      blu3print.player-config: true
  blu3print:
    description: Allowed to get Blu3PrintPlugin usage
  blu3print.duplicate:
    description: Allowed to duplicate the complete Blu3Print currently held
  blu3print.rotate:
    description: Allowed to rotate the Blu3Print currently held
  blu3print.turn:
    description: Allowed to turn the Blu3Print currently held
  blu3print.face:
    description: Allowed to change the direction of the Blu3Print currently held
  blu3print.import:
    description: Allowed to import a Blu3Print from a string  
  blu3print.export:
    description: Allowed to export the Blu3Print currently held
  blu3print.scale:
    description: Allowed to change the scale of the Blu3Print currently held
  blu3print.no-size-limit:
    description: No restrictions on size of Blu3prints
  blu3print.no-scale-limit:
    description: No restrictions on scaling of Blu3prints
  blu3print.force-place-discount:
    default: false
    description: Force placing Blu3prints no longer costs blocks unable to place
  blu3print.no-block-cost:
    default: false
    description: Removes block cost for placing Blu3prints in survival
  blu3print.name:
    description: Allowed to set the name of the Blu3Print currently held
  blu3print.give:
    description: Allowed to give blank Blu3prints
  blu3print.help:
    description: Allowed to ask for help with the Blu3PrintPlugin
  blu3print.holograms:
    description: Allowed to place hologram previews
  blu3print.config:
    description: Allowed to set per-player config for Blu3prints
  blu3print.update-available-message:
    default: op
    description: Display a message on login when an update is available
  blu3print.player-config:
   description: Allows players to configure their own configuration options for the Blu3PrintPlugin
  blu3print.global-config:
    description: Allowed to set global configuration options for the Blu3PrintPlugin
